<?xml version="1.0" encoding="UTF-8"?>
<svg width="846" height="150" viewBox="0 0 846 150" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
	<!-- Định nghĩa gradient và các hiệu ứng -->
	<defs>
		<!-- Gradient cho nền -->
		<linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0a0520">
				<animate attributeName="stop-color" values="#0a0520;#1c0a42;#0a0520" dur="10s" repeatCount="indefinite" />
			</stop>
			<stop offset="100%" stop-color="#311b5e">
				<animate attributeName="stop-color" values="#311b5e;#4b2a8c;#311b5e" dur="10s" repeatCount="indefinite" />
			</stop>
		</linearGradient>
		
		<!-- Gradient cho viền -->
		<linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#9c36b5" />
			<stop offset="50%" stop-color="#f05b91" />
			<stop offset="100%" stop-color="#9c36b5" />
			<animate attributeName="x1" values="0%;100%;0%" dur="15s" repeatCount="indefinite" />
			<animate attributeName="x2" values="100%;0%;100%" dur="15s" repeatCount="indefinite" />
		</linearGradient>
		
		<!-- Gradient cho quote mark -->
		<linearGradient id="quoteGradient" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#a64fc4" />
			<stop offset="100%" stop-color="#f05b91" />
		</linearGradient>
		
		<!-- Hiệu ứng glow -->
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="2" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
		
		<!-- Pattern cho nền -->
		<pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
			<path d="M 20 0 L 0 0 0 20" fill="none" stroke="#7749ac" stroke-width="0.5" opacity="0.2" />
		</pattern>
		
		<!-- Clip-path cho hiệu ứng đường cong -->
		<clipPath id="roundedRect">
			<rect x="0" y="0" width="846" height="150" rx="10" ry="10" />
		</clipPath>
	</defs>
	
	<!-- Nền chính -->
	<rect width="846" height="150" rx="10" ry="10" fill="url(#bgGradient)" />
	
	<!-- Pattern lưới phía sau -->
	<rect width="846" height="150" rx="10" ry="10" fill="url(#grid)" />
	
	<!-- Hiệu ứng đường sóng chuyển động -->
	<g clip-path="url(#roundedRect)">
		<path d="M-100 80 C 50 50, 150 120, 300 80 C 450 40, 550 110, 700 70 C 850 30, 950 100, 1100 60" 
			  stroke="url(#borderGradient)" stroke-width="1" fill="none" opacity="0.3">
			<animate attributeName="d" 
					 values="M-100 80 C 50 50, 150 120, 300 80 C 450 40, 550 110, 700 70 C 850 30, 950 100, 1100 60;
							 M-100 60 C 50 100, 150 40, 300 90 C 450 60, 550 120, 700 80 C 850 70, 950 40, 1100 90;
							 M-100 80 C 50 50, 150 120, 300 80 C 450 40, 550 110, 700 70 C 850 30, 950 100, 1100 60" 
					 dur="20s" repeatCount="indefinite" />
		</path>
	</g>
	
	<!-- Dấu ngoặc kép đầu -->
	<text x="100" y="65" font-family="Georgia, serif" font-size="75" fill="url(#quoteGradient)" opacity="0.15" text-anchor="middle">"</text>
	
	<!-- Dấu ngoặc kép cuối -->
	<text x="746" y="120" font-family="Georgia, serif" font-size="75" fill="url(#quoteGradient)" opacity="0.15" text-anchor="middle">"</text>
	
	<!-- Nội dung trích dẫn -->
	<g>
		<!-- Trích dẫn -->
		<text x="423" y="70" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="26" font-weight="normal" fill="#ffffff" text-anchor="middle" filter="url(#glow)">Code is like humor. When you have</text>
		<text x="423" y="100" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="26" font-weight="normal" fill="#ffffff" text-anchor="middle" filter="url(#glow)">to explain it, it's bad.</text>
		
		<!-- Tác giả -->
		<text x="423" y="130" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="18" font-weight="normal" fill="#a6c1ff" text-anchor="middle">- Cory House</text>
	</g>
	
	<!-- Hiệu ứng ánh sáng chuyển động -->
	<rect x="0" y="0" width="846" height="150" rx="10" ry="10" fill="url(#borderGradient)" opacity="0.05">
		<animate attributeName="opacity" values="0.05;0.08;0.05" dur="5s" repeatCount="indefinite" />
	</rect>
	
	<!-- Thêm các đốm sáng lấp lánh -->
	<circle cx="150" cy="40" r="1" fill="#ffffff">
		<animate attributeName="opacity" values="0;1;0" dur="4s" begin="0s" repeatCount="indefinite" />
	</circle>
	<circle cx="700" cy="50" r="1.2" fill="#ffffff">
		<animate attributeName="opacity" values="0;1;0" dur="6s" begin="1s" repeatCount="indefinite" />
	</circle>
	<circle cx="300" cy="110" r="0.8" fill="#ffffff">
		<animate attributeName="opacity" values="0;1;0" dur="5s" begin="2s" repeatCount="indefinite" />
	</circle>
	<circle cx="580" cy="35" r="1" fill="#ffffff">
		<animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.5s" repeatCount="indefinite" />
	</circle>
	<circle cx="470" cy="120" r="0.8" fill="#ffffff">
		<animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="1.5s" repeatCount="indefinite" />
	</circle>
	
	<!-- Viền nổi bật -->
	<rect x="0" y="0" width="846" height="150" rx="10" ry="10" fill="none" stroke="url(#borderGradient)" stroke-width="2" />
</svg> 