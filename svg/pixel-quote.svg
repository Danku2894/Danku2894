<svg fill="none" viewBox="0 0 846 150" width="846" height="150" xmlns="http://www.w3.org/2000/svg">
	<style>
		.container {
			font-family: sans-serif;
		}
		
		.quote-text {
			font-size: 24px;
			fill: #ffffff;
			font-weight: 300;
			text-anchor: middle;
		}
		
		.author {
			font-size: 16px;
			fill: #99ffff;
			font-weight: 400;
			text-anchor: middle;
		}
		
		.quote-mark {
			font-size: 60px;
			fill: rgba(255, 255, 255, 0.1);
			font-family: serif;
		}
	</style>
	
	<defs>
		<linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#1a0e23" />
			<stop offset="50%" stop-color="#3a1f53" />
			<stop offset="100%" stop-color="#1a0e23" />
		</linearGradient>
		<linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#ff3366" />
			<stop offset="50%" stop-color="#6633cc" />
			<stop offset="100%" stop-color="#ff3366" />
		</linearGradient>
	</defs>
	
	<rect width="846" height="150" rx="10" fill="url(#gradient)" />
	<rect x="0" y="0" width="846" height="150" rx="10" fill="url(#gradient)" stroke="url(#border-gradient)" stroke-width="2" />
	
	<text x="100" y="55" class="quote-mark">"</text>
	<text x="746" y="120" class="quote-mark">"</text>
	
	<g class="container">
		<text x="423" y="65" class="quote-text" text-anchor="middle">The best way to predict the future is to create it.</text>
		<text x="423" y="100" class="author" text-anchor="middle">- Abraham Lincoln</text>
	</g>
</svg> 