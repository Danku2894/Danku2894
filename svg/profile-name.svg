<svg fill="none" viewBox="0 0 846 150" width="846" height="150" xmlns="http://www.w3.org/2000/svg">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap');
		
		.container {
			font-family: sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 150px;
			background: linear-gradient(135deg, #1a0e23, #3a1f53);
		}
		
		.content {
			text-align: center;
		}
		
		.name {
			font-size: 40px;
			font-weight: 700;
			fill: #ff99cc;
			filter: drop-shadow(0px 0px 3px #ff3366);
		}
		
		.title {
			font-size: 20px;
			fill: #ffffff;
			font-weight: 300;
		}
		
		.subtitle {
			font-size: 16px;
			fill: #99ffff;
			font-weight: 400;
		}
		
		.kanji-bg {
			fill: rgba(255, 255, 255, 0.08);
			font-size: 100px;
			font-family: serif;
			text-anchor: middle;
		}
		
		.glow {
			stroke: url(#gradient);
			stroke-width: 2;
			fill: none;
		}
	</style>
	
	<defs>
		<linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#ff3366" />
			<stop offset="50%" stop-color="#ff99cc" />
			<stop offset="100%" stop-color="#ff3366" />
		</linearGradient>
	</defs>
	
	<rect width="846" height="150" fill="url(#gradient)" opacity="0.05" />
	<rect width="846" height="150" fill="url(#gradient)" fill-opacity="0.05" />
	
	<rect x="0" y="0" width="846" height="150" rx="10" fill="url(#gradient)" fill-opacity="0" stroke="url(#gradient)" stroke-width="2" />
	
	<text x="423" y="65" class="kanji-bg" dominant-baseline="middle">夢想</text>
	
	<g class="content">
		<text x="423" y="65" class="name" text-anchor="middle">Vo Le Quoc Dat</text>
		<text x="423" y="100" class="title" text-anchor="middle">Full Stack Developer</text>
		<text x="423" y="125" class="subtitle" text-anchor="middle">MERN Stack • Web Development • UI/UX</text>
	</g>
	
	<rect x="173" y="145" width="500" height="3" fill="url(#gradient)" />
</svg> 