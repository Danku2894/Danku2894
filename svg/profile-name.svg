<?xml version="1.0" encoding="UTF-8"?>
<svg width="846" height="150" viewBox="0 0 846 150" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
	<!-- Định nghĩa các gradient và hiệu ứng -->
	<defs>
		<!-- Gradient chính cho nền -->
		<linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#1a103c">
				<animate attributeName="stop-color" values="#1a103c;#2a1a50;#1a103c" dur="10s" repeatCount="indefinite" />
			</stop>
			<stop offset="100%" stop-color="#38235a">
				<animate attributeName="stop-color" values="#38235a;#4a2d78;#38235a" dur="10s" repeatCount="indefinite" />
			</stop>
		</linearGradient>
		
		<!-- Gradient cho viền -->
		<linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#d35db3" />
			<stop offset="50%" stop-color="#ff7eb8" />
			<stop offset="100%" stop-color="#d35db3" />
			<animate attributeName="x1" values="0%;100%;0%" dur="15s" repeatCount="indefinite" />
			<animate attributeName="x2" values="100%;0%;100%" dur="15s" repeatCount="indefinite" />
		</linearGradient>
		
		<!-- Gradient cho text chính -->
		<linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#ff9ec4" />
			<stop offset="50%" stop-color="#ffbad8" />
			<stop offset="100%" stop-color="#ff9ec4" />
			<animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite" />
			<animate attributeName="x2" values="100%;0%;100%" dur="7s" repeatCount="indefinite" />
		</linearGradient>
		
		<!-- Hiệu ứng glow -->
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
		
		<!-- Pattern Nhật Bản cho nền -->
		<pattern id="japanesePattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
			<path d="M0 15 Q15 0, 30 15 Q45 30, 60 15 M0 45 Q15 30, 30 45 Q45 60, 60 45 M-30 15 Q-15 0, 0 15 M60 15 Q75 0, 90 15" 
				  fill="none" stroke="#6f4daa" stroke-width="0.5" opacity="0.15" />
		</pattern>
		
		<!-- Mẫu họa tiết cánh hoa anh đào -->
		<path id="sakuraPetal" d="M0,0 C5,-5 10,-5 10,0 C10,5 5,10 0,5 C-5,10 -10,5 -10,0 C-10,-5 -5,-5 0,0 Z" 
			  fill="#ffbad8" opacity="0.3" />
		
		<!-- Clip-path cho hiệu ứng đường cong -->
		<clipPath id="roundedRect">
			<rect x="0" y="0" width="846" height="150" rx="10" ry="10" />
		</clipPath>
	</defs>
	
	<!-- Nền chính với gradient động -->
	<rect width="846" height="150" rx="10" ry="10" fill="url(#bgGradient)" />
	
	<!-- Pattern Nhật Bản phía sau -->
	<rect width="846" height="150" rx="10" ry="10" fill="url(#japanesePattern)" />
	
	<!-- Các cánh hoa anh đào rơi -->
	<g clip-path="url(#roundedRect)">
		<!-- Hiệu ứng đường sóng chuyển động -->
		<path d="M-100 80 C 50 50, 150 120, 300 80 C 450 40, 550 110, 700 70 C 850 30, 950 100, 1100 60" 
			  stroke="url(#borderGradient)" stroke-width="1" fill="none" opacity="0.3">
			<animate attributeName="d" 
					 values="M-100 80 C 50 50, 150 120, 300 80 C 450 40, 550 110, 700 70 C 850 30, 950 100, 1100 60;
							 M-100 60 C 50 100, 150 40, 300 90 C 450 60, 550 120, 700 80 C 850 70, 950 40, 1100 90;
							 M-100 80 C 50 50, 150 120, 300 80 C 450 40, 550 110, 700 70 C 850 30, 950 100, 1100 60" 
					 dur="20s" repeatCount="indefinite" />
		</path>
		
		<!-- Cánh hoa 1 -->
		<use xlink:href="#sakuraPetal" x="100" y="30">
			<animateTransform attributeName="transform" type="rotate" from="0 100 30" to="360 100 30" dur="20s" repeatCount="indefinite" />
			<animate attributeName="x" values="100;50;0;-50" dur="15s" repeatCount="indefinite" />
			<animate attributeName="y" values="30;80;130;180" dur="15s" repeatCount="indefinite" />
		</use>
		
		<!-- Cánh hoa 2 -->
		<use xlink:href="#sakuraPetal" x="200" y="10">
			<animateTransform attributeName="transform" type="rotate" from="0 200 10" to="360 200 10" dur="25s" repeatCount="indefinite" />
			<animate attributeName="x" values="200;150;100;50;0;-50" dur="20s" repeatCount="indefinite" />
			<animate attributeName="y" values="10;30;60;90;120;150" dur="20s" repeatCount="indefinite" />
		</use>
		
		<!-- Cánh hoa 3 -->
		<use xlink:href="#sakuraPetal" x="400" y="20">
			<animateTransform attributeName="transform" type="rotate" from="0 400 20" to="360 400 20" dur="22s" repeatCount="indefinite" />
			<animate attributeName="x" values="400;350;300;250;200;150;100;50;0;-50" dur="22s" repeatCount="indefinite" />
			<animate attributeName="y" values="20;40;60;80;100;120;140;160;180;200" dur="22s" repeatCount="indefinite" />
		</use>
		
		<!-- Cánh hoa 4 -->
		<use xlink:href="#sakuraPetal" x="600" y="15">
			<animateTransform attributeName="transform" type="rotate" from="0 600 15" to="360 600 15" dur="18s" repeatCount="indefinite" />
			<animate attributeName="x" values="600;550;500;450;400;350;300;250;200;150;100;50;0;-50" dur="18s" repeatCount="indefinite" />
			<animate attributeName="y" values="15;30;45;60;75;90;105;120;135;150;165;180;195;210" dur="18s" repeatCount="indefinite" />
		</use>
		
		<!-- Cánh hoa 5 -->
		<use xlink:href="#sakuraPetal" x="750" y="25">
			<animateTransform attributeName="transform" type="rotate" from="0 750 25" to="360 750 25" dur="20s" repeatCount="indefinite" />
			<animate attributeName="x" values="750;700;650;600;550;500;450;400;350;300;250;200;150;100;50;0;-50" dur="20s" repeatCount="indefinite" />
			<animate attributeName="y" values="25;35;45;55;65;75;85;95;105;115;125;135;145;155;165;175;185" dur="20s" repeatCount="indefinite" />
		</use>
	</g>
	
	<!-- Các chữ kanji nền -->
	<text x="200" y="85" font-family="'Noto Serif JP', serif" font-size="80" fill="rgba(255,255,255,0.04)" text-anchor="middle" dominant-baseline="middle">開発</text>
	<text x="650" y="85" font-family="'Noto Serif JP', serif" font-size="80" fill="rgba(255,255,255,0.04)" text-anchor="middle" dominant-baseline="middle">夢想</text>
	
	<!-- Nội dung chính -->
	<g>
		<!-- Tên Nhật -->
		<text x="423" y="60" font-family="'Noto Sans JP', sans-serif" font-size="38" font-weight="bold" fill="url(#textGradient)" text-anchor="middle" filter="url(#glow)">ヴォ・レ・クオック・ダット</text>
		
		<!-- Tiêu đề -->
		<text x="423" y="95" font-family="'Noto Sans JP', sans-serif" font-size="22" font-weight="normal" fill="#ffffff" text-anchor="middle">フルスタック開発者</text>
		
		<!-- Các kỹ năng -->
		<text x="423" y="125" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="normal" fill="#a6c1ff" text-anchor="middle">ウェブ開発 • UI/UX</text>
	</g>
	
	<!-- Viền đáy có hiệu ứng glow -->
	<rect x="173" y="147" width="500" height="2" fill="url(#borderGradient)" filter="url(#glow)">
		<animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite" />
	</rect>
	
	<!-- Viền nổi bật -->
	<rect x="0" y="0" width="846" height="150" rx="10" ry="10" fill="none" stroke="url(#borderGradient)" stroke-width="2" />
</svg> 