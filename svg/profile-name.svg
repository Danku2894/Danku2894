<?xml version="1.0" encoding="UTF-8"?>
<svg width="846" height="150" viewBox="0 0 846 150" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
	<!-- Định nghĩa các gradient và hiệu ứng -->
	<defs>
		<!-- Gradient chính cho nền -->
		<linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0a0520">
				<animate attributeName="stop-color" values="#0a0520;#1c0a42;#0a0520" dur="10s" repeatCount="indefinite" />
			</stop>
			<stop offset="100%" stop-color="#311b5e">
				<animate attributeName="stop-color" values="#311b5e;#4b2a8c;#311b5e" dur="10s" repeatCount="indefinite" />
			</stop>
		</linearGradient>
		
		<!-- Gradient cho viền -->
		<linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#9c36b5" />
			<stop offset="50%" stop-color="#f05b91" />
			<stop offset="100%" stop-color="#9c36b5" />
			<animate attributeName="x1" values="0%;100%;0%" dur="15s" repeatCount="indefinite" />
			<animate attributeName="x2" values="100%;0%;100%" dur="15s" repeatCount="indefinite" />
		</linearGradient>
		
		<!-- Gradient cho text -->
		<linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#ff9ec4" />
			<stop offset="50%" stop-color="#ffbad8" />
			<stop offset="100%" stop-color="#ff9ec4" />
			<animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite" />
			<animate attributeName="x2" values="100%;0%;100%" dur="7s" repeatCount="indefinite" />
		</linearGradient>
		
		<!-- Hiệu ứng glow -->
		<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
		
		<!-- Hiệu ứng glow mạnh hơn cho viền -->
		<filter id="strongGlow" x="-20%" y="-20%" width="140%" height="140%">
			<feGaussianBlur stdDeviation="6" result="blur" />
			<feComposite in="SourceGraphic" in2="blur" operator="over" />
		</filter>
		
		<!-- Pattern lưới cho nền -->
		<pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
			<path d="M 20 0 L 0 0 0 20" fill="none" stroke="#7749ac" stroke-width="0.5" opacity="0.3" />
		</pattern>
		
		<!-- Định nghĩa clip-path cho hiệu ứng đường cong -->
		<clipPath id="roundedRect">
			<rect x="0" y="0" width="846" height="150" rx="10" ry="10" />
		</clipPath>
	</defs>
	
	<!-- Nền chính với gradient động -->
	<rect width="846" height="150" rx="10" ry="10" fill="url(#bgGradient)" />
	
	<!-- Pattern lưới phía sau -->
	<rect width="846" height="150" rx="10" ry="10" fill="url(#grid)" />
	
	<!-- Hiệu ứng đường sóng chuyển động -->
	<g clip-path="url(#roundedRect)">
		<path d="M-100 80 C 50 50, 150 120, 300 80 C 450 40, 550 110, 700 70 C 850 30, 950 100, 1100 60" 
			  stroke="url(#borderGradient)" stroke-width="1" fill="none" opacity="0.3">
			<animate attributeName="d" 
					 values="M-100 80 C 50 50, 150 120, 300 80 C 450 40, 550 110, 700 70 C 850 30, 950 100, 1100 60;
							 M-100 60 C 50 100, 150 40, 300 90 C 450 60, 550 120, 700 80 C 850 70, 950 40, 1100 90;
							 M-100 80 C 50 50, 150 120, 300 80 C 450 40, 550 110, 700 70 C 850 30, 950 100, 1100 60" 
					 dur="20s" repeatCount="indefinite" />
		</path>
		
		<path d="M-100 100 C 50 70, 150 140, 300 100 C 450 60, 550 130, 700 90 C 850 50, 950 120, 1100 80" 
			  stroke="url(#borderGradient)" stroke-width="1.5" fill="none" opacity="0.2">
			<animate attributeName="d" 
					 values="M-100 100 C 50 70, 150 140, 300 100 C 450 60, 550 130, 700 90 C 850 50, 950 120, 1100 80;
							 M-100 80 C 50 120, 150 60, 300 110 C 450 80, 550 140, 700 100 C 850 90, 950 60, 1100 110;
							 M-100 100 C 50 70, 150 140, 300 100 C 450 60, 550 130, 700 90 C 850 50, 950 120, 1100 80" 
					 dur="15s" repeatCount="indefinite" />
		</path>
	</g>
	
	<!-- Chữ kanji trong nền -->
	<text x="423" y="85" font-family="'Noto Serif JP', serif" font-size="90" fill="rgba(255,255,255,0.04)" text-anchor="middle" dominant-baseline="middle">開発</text>
	
	<!-- Nội dung chính -->
	<g>
		<!-- Tên -->
		<text x="423" y="60" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="38" font-weight="bold" fill="url(#textGradient)" text-anchor="middle" filter="url(#glow)">Vo Le Quoc Dat</text>
		
		<!-- Tiêu đề -->
		<text x="423" y="95" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="22" font-weight="normal" fill="#ffffff" text-anchor="middle">Full Stack Developer</text>
		
		<!-- Các kỹ năng -->
		<text x="423" y="125" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="16" font-weight="normal" fill="#a6c1ff" text-anchor="middle">MERN Stack • Web Development • UI/UX</text>
	</g>
	
	<!-- Viền đáy có hiệu ứng glow -->
	<rect x="173" y="147" width="500" height="2" fill="url(#borderGradient)" filter="url(#strongGlow)">
		<animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite" />
	</rect>
	
	<!-- Thêm các đốm sáng lấp lánh -->
	<circle cx="200" cy="30" r="1" fill="#ffffff">
		<animate attributeName="opacity" values="0;1;0" dur="3s" begin="0s" repeatCount="indefinite" />
	</circle>
	<circle cx="650" cy="40" r="1.2" fill="#ffffff">
		<animate attributeName="opacity" values="0;1;0" dur="5s" begin="1s" repeatCount="indefinite" />
	</circle>
	<circle cx="380" cy="120" r="0.8" fill="#ffffff">
		<animate attributeName="opacity" values="0;1;0" dur="4s" begin="2s" repeatCount="indefinite" />
	</circle>
	<circle cx="500" cy="25" r="1" fill="#ffffff">
		<animate attributeName="opacity" values="0;1;0" dur="6s" begin="0.5s" repeatCount="indefinite" />
	</circle>
	<circle cx="750" cy="100" r="0.8" fill="#ffffff">
		<animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="1.5s" repeatCount="indefinite" />
	</circle>
	
	<!-- Viền nổi bật -->
	<rect x="0" y="0" width="846" height="150" rx="10" ry="10" fill="none" stroke="url(#borderGradient)" stroke-width="2" />
</svg> 