<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Định nghĩa gradient và hiệu ứng -->
  <defs>
    <!-- Gradient cho nền -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#9e78d9">
        <animate attributeName="stop-color" values="#9e78d9;#7454b3;#9e78d9" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#5d3896">
        <animate attributeName="stop-color" values="#5d3896;#4a2d78;#5d3896" dur="5s" repeatCount="indefinite" />
      </stop>
    </radialGradient>
    
    <!-- Gradient cho mặt -->
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43321c" />
      <stop offset="100%" stop-color="#332510" />
    </linearGradient>
    
    <!-- Filter cho hiệu ứng glow -->
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Clip-path cho vùng nhìn -->
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="180" />
    </clipPath>
  </defs>
  
  <!-- Nền chính -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGradient)">
    <animate attributeName="opacity" values="1;0.9;1" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Vòng tròn trắng bên trong -->
  <circle cx="200" cy="200" r="180" fill="#f5f1ff" />
  
  <!-- Nhóm phần đầu và mặt -->
  <g clip-path="url(#circleClip)">
    <!-- Đầu -->
    <ellipse cx="200" cy="230" rx="120" ry="130" fill="url(#faceGradient)" />
    
    <!-- Tai trái -->
    <ellipse cx="80" cy="190" rx="25" ry="35" fill="url(#faceGradient)" />
    
    <!-- Tai phải -->
    <ellipse cx="320" cy="190" rx="25" ry="35" fill="url(#faceGradient)" />
    
    <!-- Mắt trái -->
    <g>
      <ellipse cx="160" cy="190" rx="25" ry="20" fill="white" />
      <circle cx="160" cy="190" r="10" fill="#000">
        <animate attributeName="cy" values="190;188;190" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="165" cy="185" r="3" fill="#ffffff" />
    </g>
    
    <!-- Mắt phải -->
    <g>
      <ellipse cx="240" cy="190" rx="25" ry="20" fill="white" />
      <circle cx="240" cy="190" r="10" fill="#000">
        <animate attributeName="cy" values="190;188;190" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="245" cy="185" r="3" fill="#ffffff" />
    </g>
    
    <!-- Mũi -->
    <path d="M200 210 L190 225 L210 225 Z" fill="#000" />
    
    <!-- Miệng -->
    <path d="M170 250 Q200 270 230 250" stroke="#000" stroke-width="3" fill="none">
      <animate attributeName="d" values="M170 250 Q200 270 230 250; M170 245 Q200 265 230 245; M170 250 Q200 270 230 250" dur="5s" repeatCount="indefinite" />
    </path>
    
    <!-- Chữ "猿" (Saru - khỉ trong tiếng Nhật) phía dưới -->
    <text x="200" y="330" font-family="'Noto Serif JP', serif" font-size="80" font-weight="bold" fill="#43321c" text-anchor="middle" opacity="0.2">猿</text>
  </g>
  
  <!-- Hiệu ứng hoa anh đào bay -->
  <g>
    <circle cx="100" cy="50" r="3" fill="#ffbad8">
      <animate attributeName="cx" values="100;80;60;40;20;0;-20" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="50;70;90;110;90;70;50" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="70" r="4" fill="#ffbad8">
      <animate attributeName="cx" values="150;130;110;90;70;50;30;10;-10" dur="15s" repeatCount="indefinite" />
      <animate attributeName="cy" values="70;90;110;130;150;130;110;90;70" dur="15s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="15s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="120" r="3" fill="#ffbad8">
      <animate attributeName="cx" values="300;280;260;240;220;200;180;160;140;120;100;80;60;40;20;0;-20" dur="20s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;140;120;100;120;140;120;100;120;140;120;100;120;140;120;100;120" dur="20s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="350" cy="180" r="2" fill="#ffbad8">
      <animate attributeName="cx" values="350;330;310;290;270;250;230;210;190;170;150;130;110;90;70;50;30;10;-10" dur="25s" repeatCount="indefinite" />
      <animate attributeName="cy" values="180;200;180;160;180;200;180;160;180;200;180;160;180;200;180;160;180;200;180" dur="25s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="25s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Viền ngoài có hiệu ứng chuyển động -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="#9e78d9" stroke-width="2">
    <animate attributeName="stroke" values="#9e78d9;#7454b3;#9e78d9" dur="5s" repeatCount="indefinite" />
    <animate attributeName="r" values="195;198;195" dur="3s" repeatCount="indefinite" />
  </circle>
</svg> 