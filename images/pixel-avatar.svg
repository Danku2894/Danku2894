<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with Animated Gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(0)">
      <stop offset="0%" stop-color="#1a0e23">
        <animate attributeName="stop-color" values="#1a0e23; #3a1f53; #1a0e23" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3a1f53">
        <animate attributeName="stop-color" values="#3a1f53; #5d3983; #3a1f53" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <!-- Animated Mask for Neon Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg-gradient)">
    <animateTransform attributeName="gradientTransform" 
                      type="rotate" 
                      from="0 0.5 0.5" 
                      to="360 0.5 0.5" 
                      dur="20s" 
                      repeatCount="indefinite" />
  </rect>
  
  <!-- Grid Pattern -->
  <path d="M0,0 L200,0 L200,200 L0,200 Z" fill="none" stroke="#ff66cc22" stroke-width="0.5" stroke-dasharray="4,4" />
  <path d="M0,40 L200,40 M0,80 L200,80 M0,120 L200,120 M0,160 L200,160 M40,0 L40,200 M80,0 L80,200 M120,0 L120,200 M160,0 L160,200" 
        stroke="#ff66cc11" stroke-width="0.5" />
  
  <!-- Anime Character - Japanese Style -->
  <!-- Head -->
  <rect x="80" y="40" width="40" height="40" fill="#ffe6e6">
    <animate attributeName="fill" values="#ffe6e6;#ffdbac;#ffe6e6" dur="5s" repeatCount="indefinite" />
  </rect>
  
  <!-- Hair -->
  <rect x="70" y="30" width="60" height="20" fill="#202060" />
  <rect x="70" y="30" width="10" height="40" fill="#202060" />
  <rect x="130" y="30" width="10" height="30" fill="#202060" />
  <rect x="70" y="50" width="10" height="10" fill="#202060" />
  <rect x="130" y="50" width="10" height="10" fill="#202060" />
  <rect x="80" y="30" width="10" height="10" fill="#202060" />
  <rect x="120" y="30" width="10" height="10" fill="#202060" />
  
  <!-- Eyes - Anime Style -->
  <rect x="85" y="50" width="10" height="8" fill="#ffffff" />
  <rect x="105" y="50" width="10" height="8" fill="#ffffff" />
  <rect x="87" y="52" width="6" height="6" fill="#6644cc">
    <animate attributeName="fill" values="#6644cc;#9966ff;#6644cc" dur="3s" repeatCount="indefinite" />
  </rect>
  <rect x="107" y="52" width="6" height="6" fill="#6644cc">
    <animate attributeName="fill" values="#6644cc;#9966ff;#6644cc" dur="3s" repeatCount="indefinite" />
  </rect>
  <rect x="90" y="50" width="2" height="2" fill="#ffffff" />
  <rect x="110" y="50" width="2" height="2" fill="#ffffff" />
  
  <!-- Blush -->
  <rect x="75" y="60" width="6" height="3" fill="#ff99cc" opacity="0.6" />
  <rect x="119" y="60" width="6" height="3" fill="#ff99cc" opacity="0.6" />
  
  <!-- Mouth -->
  <rect x="95" y="65" width="10" height="3" fill="#ff6699" />
  
  <!-- Japanese School Uniform -->
  <!-- Body - Seifuku (School Uniform) -->
  <rect x="85" y="80" width="30" height="30" fill="#3a1f53" />
  <!-- Sailor Collar -->
  <rect x="85" y="80" width="30" height="8" fill="#ffffff" />
  <rect x="87" y="88" width="26" height="2" fill="#ff3366" />
  
  <!-- Arms -->
  <rect x="75" y="80" width="10" height="20" fill="#3a1f53" />
  <rect x="115" y="80" width="10" height="20" fill="#3a1f53" />
  <rect x="75" y="100" width="10" height="5" fill="#ffe6e6" />
  <rect x="115" y="100" width="10" height="5" fill="#ffe6e6" />
  
  <!-- Legs -->
  <rect x="90" y="110" width="8" height="20" fill="#3a1f53" />
  <rect x="102" y="110" width="8" height="20" fill="#3a1f53" />
  <!-- Shoes -->
  <rect x="90" y="130" width="8" height="5" fill="#202060" />
  <rect x="102" y="130" width="8" height="5" fill="#202060" />
  
  <!-- Neon Glow Elements -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#ff3366" stroke-width="0.5" opacity="0.2">
    <animate attributeName="r" values="75;80;75" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <!-- Kanji Symbol in Background -->
  <text x="140" y="35" font-family="'Noto Serif JP', serif" font-size="14" fill="#ff336633">漫画</text>
  <text x="40" y="165" font-family="'Noto Serif JP', serif" font-size="14" fill="#ff336633">アニメ</text>
  
  <!-- Floating Pixel -->
  <rect x="70" y="40" width="2" height="2" fill="#ff3366">
    <animate attributeName="y" values="40;35;40" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
  </rect>
  <rect x="130" y="60" width="2" height="2" fill="#ff3366">
    <animate attributeName="y" values="60;55;60" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite" />
  </rect>
</svg> 